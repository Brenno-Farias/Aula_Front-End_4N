<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="quadro-de-tarefas">Quadro de tarefas acadêmico.</h1>
    </header>

    <main>

        <div id="status-regiao" role="status" aria-live="polite"></div>

        <form id="form-filtros">
            <fieldset class="filtroBusca">
                <legend>Filtros de busca: </legend>
                <label for="titulo">Título da obra:</label>
                <input id="titulo" type="search" placeholder="título">

                <label for="prioridade">Prioridade da tarefa: </label>
                <select name="Prioridade" id="prioridade">
                    <option value="">Todas</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>

                <label for="status">Status da tarefa: </label>
                <select name="status" id="status">
                    <option value="">Todos</option>
                    <option value="a-fazer">A fazer</option>
                    <option value="em-andamento">Em andamento</option>
                    <option value="em-revisao">Em revisão</option>
                    <option value="concluida">Concluída</option>
                </select>

                <label for="ordem-prazo">Ordenar por prazo: </label>
                <select name="ordem-prazo" id="ordem-prazo">
                    <option value="">Sem ordenação</option>
                    <option value="crescente">Mais próximas (Crescente)</option>
                    <option value="decrescente">Mais distantes (Decrescente)</option>
                </select>

                <button type="button" id="btn-limpar">Limpar filtros</button>

            </fieldset>
        </form>

        <section class="quadro" data-quadro aria-labelledby="quadro-de-tarefas">
            <div class="coluna" aria-labelledby="titulo-afazer">
                <h2 id="titulo-afazer">Tarefas a fazer</h2>
                <ul class="lista-cards" data-lista-status="a-fazer"></ul>
            </div>

            <div class="coluna" aria-labelledby="titulo-emandamento">
                <h2 id="titulo-emandamento">Tarefas em andamento</h2>
                <ul class="lista-cards" data-lista-status="em-andamento"></ul>
            </div>

            <div class="coluna" aria-labelledby="titulo-emrevisao">
                <h2 id="titulo-emrevisao">Tarefas em revisão</h2>
                <ul class="lista-cards" data-lista-status="em-revisao"></ul>
            </div>

            <div class="coluna" aria-labelledby="titulo-concluida">
                <h2 id="titulo-concluida">Tarefas concluida</h2>
                <ul class="lista-cards" data-lista-status="concluida"></ul>
            </div>
        </section>

    </main>

    <footer>
        <h3>
            &star; Brenno Milhomem Farias - Desenvolvimento Front-End &star;
        </h3>
    </footer>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
