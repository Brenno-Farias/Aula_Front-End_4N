<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Missões RPG</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Press Start 2P', monospace; image-rendering: pixelated; }
    
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #111119;
      color: #fff;
      margin: 0;
      padding: 15px;
      padding-bottom: 90px;
    }


    :focus-visible {
      outline: 3px solid #f3a833 !important;
      outline-offset: 3px;
    }


    .header { text-align: center; margin-bottom: 20px; border-bottom: 4px solid #4a3d59; padding-bottom: 10px; }
    .header h1 { color: #f3a833; font-size: 1.1rem; text-shadow: 2px 2px #000; margin: 0; }


    .controls-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
      width: 100%;
    }
    .search-input, .filter-select {
      background: #26172e;
      border: 3px solid #f3a833;
      color: #fff;
      padding: 10px;
      font-size: 0.5rem;
      border-radius: 0;
    }
    .search-input { flex: 1; max-width: 320px; min-width: 200px; }
    .search-input::placeholder { color: #aaa; }
    .filter-select { cursor: pointer; }


    .quest-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
    }


    @media (max-width: 900px) {
      .quest-board { grid-template-columns: repeat(2, 1fr); }
    }


    @media (max-width: 550px) {
      .quest-board { grid-template-columns: 1fr; }
    }

    .column {
      background: #26172e;
      border: 4px solid #4a3d59;
      padding: 10px;
      border-radius: 4px;
      min-width: 0; 
    }
    .column-title {
      font-size: 0.6rem;
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
      border-bottom: 2px dashed #4a3d59;
      padding-bottom: 8px;
    }


    .quest-card {
      background-color: #f4e4bc;
      border: 4px solid #8b5a2b;
      color: #2b1d0c;
      padding: 15px 10px 10px 10px;
      margin-bottom: 15px;
      position: relative;
      box-shadow: 4px 4px 0px #000;
      word-break: break-word;
    }


    .crystal {
      width: 18px;
      height: 18px;
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      border: 2px solid #000;
      outline: 2px solid #ffffff; 
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
      padding: 0;
    }
    .status-todo { background-color: #e74c3c; }      
    .status-in_progress { background-color: #e67e22; } 
    .status-review { background-color: #f1c40f; }     
    .status-done { background-color: #3498db; }        

    .quest-meta { display: flex; justify-content: space-between; font-size: 0.42rem; color: #8b5a2b; font-weight: bold; margin-top: 5px; }
    .quest-priority { color: #a93226; text-transform: uppercase; }
    .quest-title { font-size: 0.55rem; margin: 10px 0 6px 0; line-height: 1.3; font-weight: bold; }
    .quest-desc { font-size: 0.45rem; color: #4a3b2c; line-height: 1.4; margin-bottom: 10px; background: rgba(0,0,0,0.05); padding: 5px; border-radius: 2px; }
    .quest-xp { font-size: 0.48rem; color: #5c3d1e; margin-bottom: 8px; text-align: right; }

    .btn-complete {
      background: #27ae60;
      border: 2px solid #000;
      color: #fff;
      font-size: 0.5rem;
      padding: 8px;
      width: 100%;
      cursor: pointer;
      text-shadow: 1px 1px #000;
      margin-top: 5px;
    }
    .badge-done {
      background: #2980b9;
      color: #fff;
      font-size: 0.45rem;
      text-align: center;
      padding: 6px;
      border: 2px solid #000;
      margin-top: 5px;
    }


    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); display: none; justify-content: center;
      align-items: center; z-index: 1000;
    }
    .modal-box {
      background: #26172e; border: 4px solid #f3a833; padding: 25px;
      text-align: center; max-width: 320px; box-shadow: 6px 6px 0px #000;
    }
    .modal-text { font-size: 0.65rem; line-height: 1.5; color: #fff; margin-bottom: 20px; }
    .modal-buttons { display: flex; gap: 15px; justify-content: center; }
    .modal-btn {
      border: 2px solid #000; padding: 10px 15px; font-size: 0.55rem; cursor: pointer;
      text-shadow: 1px 1px #000; color: #fff;
    }
    .btn-yes { background: #27ae60; }
    .btn-no { background: #e74c3c; }


    .hud-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #000;
      border-top: 4px solid #f3a833; padding: 12px 20px; display: flex;
      justify-content: center; gap: 30px; align-items: center; font-size: 0.55rem; z-index: 100;
    }
    .stat-box { display: flex; align-items: center; gap: 10px; }
    .bar-container { width: 120px; height: 12px; background: #333; border: 2px solid #fff; }
    .bar-fill-xp { height: 100%; background: #9b59b6; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <header class="header">
    <h1>🏰 GUILDA DOS DEVS</h1>
  </header>

  <!-- Barra de Pesquisa e Filtros -->
  <section class="controls-bar" aria-label="Filtros de busca">
    <input 
      type="text" 
      id="search-input" 
      class="search-input" 
      placeholder="BUSCAR MISSÃO..." 
      aria-label="Buscar missão por título ou descrição"
      oninput="renderQuests()"
    >
    <select 
      id="filter-priority" 
      class="filter-select" 
      aria-label="Filtrar por nível de prioridade"
      onchange="renderQuests()"
    >
      <option value="all">TODAS PRIORIDADES</option>
      <option value="Baixa">BAIXA</option>
      <option value="Média">MÉDIA</option>
      <option value="Alta">ALTA</option>
      <option value="Crítica">CRÍTICA</option>
    </select>
  </section>

  <!-- Quadro Kanban -->
  <main class="quest-board" aria-label="Quadro de tarefas">
    <div class="column" aria-label="Coluna A Fazer">
      <div class="column-title" style="color: #e74c3c;">A Fazer</div>
      <div id="col-todo"></div>
    </div>
    <div class="column" aria-label="Coluna Em Andamento">
      <div class="column-title" style="color: #e67e22;">Em Andamento</div>
      <div id="col-in_progress"></div>
    </div>
    <div class="column" aria-label="Coluna Em Revisão">
      <div class="column-title" style="color: #f1c40f;">Em Revisão</div>
      <div id="col-review"></div>
    </div>
    <div class="column" aria-label="Coluna Concluídas">
      <div class="column-title" style="color: #3498db;">Concluídas</div>
      <div id="col-done"></div>
    </div>
  </main>

  <!-- HUD Inferior de Nível -->
  <footer class="hud-bar" aria-label="Status do Jogador">
    <div class="stat-box">
      <span>NÍVEL: <span id="player-lvl" style="color: #f1c40f;">1</span></span>
    </div>
    <div class="stat-box">
      <span>XP:</span>
      <div class="bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div id="xp-bar" class="bar-fill-xp"></div>
      </div>
      <span id="xp-text">0/100</span>
    </div>
  </footer>

  <!-- Modal de Confirmação -->
  <div id="modal-confirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div id="modal-title" class="modal-text">DESEJA CONCLUIR A TAREFA?</div>
      <div class="modal-buttons">
        <button id="btn-modal-yes" class="modal-btn btn-yes" onclick="confirmQuestCompletion(true)">SIM</button>
        <button class="modal-btn btn-no" onclick="confirmQuestCompletion(false)">NÃO</button>
      </div>
    </div>
  </div>

  <script>
    let level = 1;
    let xp = 0;
    let xpNext = 100;
    let selectedQuestId = null;

    const quests = [
      { 
        id: 1, 
        title: "Refatorar CSS", 
        desc: "Botão de login desalinhado em telas mobile.", 
        xp: 30, 
        rank: "Rank E", 
        priority: "Baixa", 
        status: "todo" 
      },
      { 
        id: 2, 
        title: "Bug no Carrinho", 
        desc: "Itens somem ao atualizar o checkout.", 
        xp: 70, 
        rank: "Rank C", 
        priority: "Alta", 
        status: "in_progress" 
      },
      { 
        id: 3, 
        title: "Migração de Banco", 
        desc: "Atualizar esquema do PostgreSQL para suporte a UUID.", 
        xp: 150, 
        rank: "Rank S", 
        priority: "Crítica", 
        status: "review" 
      }
    ];

    const crystalClasses = {
      todo: "status-todo",
      in_progress: "status-in_progress",
      review: "status-review",
      done: "status-done"
    };

    function renderQuests() {

      document.getElementById("col-todo").innerHTML = "";
      document.getElementById("col-in_progress").innerHTML = "";
      document.getElementById("col-review").innerHTML = "";
      document.getElementById("col-done").innerHTML = "";

      const query = document.getElementById("search-input").value.toLowerCase().trim();
      const priorityFilter = document.getElementById("filter-priority").value;


      const filteredQuests = quests.filter(q => {
        const matchesSearch = q.title.toLowerCase().includes(query) || q.desc.toLowerCase().includes(query);
        const matchesPriority = priorityFilter === "all" || q.priority === priorityFilter;
        return matchesSearch && matchesPriority;
      });

      filteredQuests.forEach(quest => {
        const card = document.createElement("article");
        card.className = "quest-card";
        
        let actionArea = "";
        if (quest.status === "review") {
          actionArea = `<button class="btn-complete" onclick="openModal(${quest.id})" aria-label="Finalizar missão ${quest.title}">FINALIZAR</button>`;
        } else if (quest.status === "done") {
          actionArea = `<div class="badge-done" aria-label="Status: Concluída">✔ CONCLUÍDA</div>`;
        }

        card.innerHTML = `
          <button 
            class="crystal ${crystalClasses[quest.status]}" 
            onclick="advanceByCrystal(${quest.id})" 
            aria-label="Avançar status da missão: ${quest.title}"
            title="Avançar etapa"
          ></button>
          <div class="quest-meta">
            <span>${quest.rank}</span>
            <span class="quest-priority">${quest.priority}</span>
          </div>
          <h2 class="quest-title">${quest.title}</h2>
          <p class="quest-desc">${quest.desc}</p>
          <div class="quest-xp">✨ XP: ${quest.xp}</div>
          ${actionArea}
        `;

        document.getElementById(`col-${quest.status}`).appendChild(card);
      });
    }

    function advanceByCrystal(id) {
      const quest = quests.find(q => q.id === id);
      
      if (quest.status === "todo") {
        quest.status = "in_progress";
      } else if (quest.status === "in_progress") {
        quest.status = "review";
      } else if (quest.status === "review") {
        alert("📜 Use o botão 'FINALIZAR' para concluir esta missão!");
        return;
      }
      
      renderQuests();
    }

    function openModal(id) {
      selectedQuestId = id;
      const modal = document.getElementById("modal-confirm");
      modal.style.display = "flex";

      setTimeout(() => document.getElementById("btn-modal-yes").focus(), 50);
    }

    function confirmQuestCompletion(confirmed) {
      document.getElementById("modal-confirm").style.display = "none";
      if (selectedQuestId === null) return;

      const quest = quests.find(q => q.id === selectedQuestId);

      if (confirmed) {
        xp += quest.xp;
        quest.status = "done";

        if (xp >= xpNext) {
          level++;
          xp -= xpNext;
          xpNext = Math.round(xpNext * 1.5);
          alert(`🎉 LEVEL UP! Você alcançou o Nível ${level}!`);
        }
      } else {
        quest.status = "in_progress";
      }

      selectedQuestId = null;
      updateHUD();
      renderQuests();
    }

    function updateHUD() {
      document.getElementById("player-lvl").innerText = level;
      document.getElementById("xp-text").innerText = `${xp}/${xpNext}`;
      document.getElementById("xp-bar").style.width = `${(xp / xpNext) * 100}%`;
    }


    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.getElementById("modal-confirm").style.display === "flex") {
        confirmQuestCompletion(false);
      }
    });

    renderQuests();
    updateHUD();
  </script>
</body>
</html>
